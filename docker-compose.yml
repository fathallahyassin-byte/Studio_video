# Services locaux pour le développement : `npm run db:up`
# Le port n'écoute que sur 127.0.0.1 : le mot de passe ci-dessous est une valeur de dev.
# La file de tâches vit dans PostgreSQL (table AgentJob) : pas de Redis.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
